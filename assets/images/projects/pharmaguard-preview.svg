<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none" width="100%" height="100%">
  <rect width="600" height="240" rx="8" fill="#111827"/>
  <defs>
    <pattern id="grid-pg" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow-pg" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="600" height="240" fill="url(#grid-pg)"/>

  <!-- React UI -->
  <g transform="translate(35, 75)">
    <rect width="100" height="90" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="24" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">React UI</text>
    <text x="12" y="48" fill="#94a3b8" font-family="sans-serif" font-size="9">Input Query</text>
    <text x="12" y="68" fill="#94a3b8" font-family="sans-serif" font-size="9">Status Stream</text>
  </g>

  <path d="M 135 120 L 175 120" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-pg)"/>

  <!-- FastAPI Gateway -->
  <g transform="translate(180, 65)">
    <rect width="110" height="110" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <text x="10" y="24" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">FastAPI API</text>
    <line x1="10" y1="32" x2="100" y2="32" stroke="#374151" stroke-width="1"/>
    <text x="10" y="52" fill="#cbd5e1" font-family="monospace" font-size="9">Pydantic Schema</text>
    <text x="10" y="72" fill="#cbd5e1" font-family="monospace" font-size="9">Endpoint Router</text>
    <text x="10" y="92" fill="#cbd5e1" font-family="monospace" font-size="9">Async Queue</text>
  </g>

  <path d="M 290 120 L 330 120" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-pg)"/>

  <!-- LangGraph Node Graph -->
  <g transform="translate(335, 45)">
    <rect width="230" height="150" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="12" y="22" fill="#c084fc" font-family="monospace" font-size="10" font-weight="bold">LangGraph Execution Cycle</text>
    
    <!-- Nodes -->
    <rect x="15" y="40" width="85" height="35" rx="4" fill="#334155" stroke="#a78bfa" stroke-width="1"/>
    <text x="20" y="62" fill="#f8fafc" font-family="monospace" font-size="9">Node: Validate</text>

    <rect x="130" y="40" width="85" height="35" rx="4" fill="#334155" stroke="#a78bfa" stroke-width="1"/>
    <text x="135" y="62" fill="#f8fafc" font-family="monospace" font-size="9">Node: Search</text>

    <rect x="75" y="95" width="85" height="35" rx="4" fill="#334155" stroke="#10b981" stroke-width="1"/>
    <text x="80" y="117" fill="#6ee7b7" font-family="monospace" font-size="9">Node: Synthesize</text>

    <!-- Internal cyclic paths -->
    <path d="M 100 57 L 125 57" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arrow-pg)"/>
    <path d="M 172 75 L 140 95" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arrow-pg)"/>
    <path d="M 75 112 L 40 75" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="2 2"/>
  </g>
</svg>
