<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none" width="100%" height="100%">
  <rect width="600" height="240" rx="8" fill="#111827"/>
  <!-- Grid background lines -->
  <defs>
    <pattern id="grid-insight" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="600" height="240" fill="url(#grid-insight)"/>
  
  <!-- Dimension Table 1: Dim_Product -->
  <g transform="translate(40, 30)">
    <rect width="130" height="75" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
    <rect width="130" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="10" y="16" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold">dim_product</text>
    <text x="10" y="38" fill="#94a3b8" font-family="monospace" font-size="9">PK product_id</text>
    <text x="10" y="52" fill="#64748b" font-family="monospace" font-size="9">   sku, category</text>
    <text x="10" y="66" fill="#64748b" font-family="monospace" font-size="9">   reorder_point</text>
  </g>

  <!-- Dimension Table 2: Dim_Inventory_Stock -->
  <g transform="translate(40, 135)">
    <rect width="130" height="75" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
    <rect width="130" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="10" y="16" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold">dim_inventory</text>
    <text x="10" y="38" fill="#94a3b8" font-family="monospace" font-size="9">PK warehouse_id</text>
    <text x="10" y="52" fill="#64748b" font-family="monospace" font-size="9">   current_stock</text>
    <text x="10" y="66" fill="#64748b" font-family="monospace" font-size="9">   turnover_days</text>
  </g>

  <!-- Connector Lines -->
  <path d="M 170 67 L 235 110" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 170 172 L 235 130" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Central Fact Table: Fact_Sales_Movement -->
  <g transform="translate(235, 60)">
    <rect width="150" height="120" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="150" height="26" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="12" y="18" fill="#fcd34d" font-family="monospace" font-size="11" font-weight="bold">fact_sales_movement</text>
    <text x="12" y="44" fill="#cbd5e1" font-family="monospace" font-size="9">FK product_id</text>
    <text x="12" y="60" fill="#cbd5e1" font-family="monospace" font-size="9">FK warehouse_id</text>
    <text x="12" y="76" fill="#cbd5e1" font-family="monospace" font-size="9">   units_sold</text>
    <text x="12" y="92" fill="#cbd5e1" font-family="monospace" font-size="9">   revenue_amount</text>
    <text x="12" y="108" fill="#cbd5e1" font-family="monospace" font-size="9">   velocity_index</text>
  </g>

  <!-- Connector to Analytics Processing -->
  <path d="M 385 120 L 440 120" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Analytics & KPI Output Block -->
  <g transform="translate(440, 70)">
    <rect width="125" height="100" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="10" y="22" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="bold">Analytics Views</text>
    <line x1="10" y1="30" x2="115" y2="30" stroke="#374151" stroke-width="1"/>
    <text x="10" y="48" fill="#94a3b8" font-family="sans-serif" font-size="9">• Stock Velocity</text>
    <text x="10" y="66" fill="#94a3b8" font-family="sans-serif" font-size="9">• Reorder Triggers</text>
    <text x="10" y="84" fill="#94a3b8" font-family="sans-serif" font-size="9">• Sales Aggregates</text>
  </g>
</svg>
