<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none" width="100%" height="100%">
  <rect width="600" height="240" rx="8" fill="#111827"/>
  <defs>
    <pattern id="grid-dp" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow-dp" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="600" height="240" fill="url(#grid-dp)"/>

  <!-- Stage 1: Input Video Stream -->
  <g transform="translate(35, 70)">
    <rect width="100" height="100" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <text x="12" y="24" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="bold">Source Video</text>
    <text x="12" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="9">MP4 / MKV</text>
    <text x="12" y="70" fill="#64748b" font-family="monospace" font-size="9">CLI Argument</text>
  </g>

  <path d="M 135 120 L 175 120" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-dp)"/>

  <!-- Stage 2: Audio Extraction & Demux -->
  <g transform="translate(180, 55)">
    <rect width="115" height="130" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="24" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">Demuxing</text>
    <line x1="12" y1="32" x2="103" y2="32" stroke="#374151" stroke-width="1"/>
    <text x="12" y="52" fill="#cbd5e1" font-family="monospace" font-size="9">Stream Split</text>
    <text x="12" y="72" fill="#cbd5e1" font-family="monospace" font-size="9">WAV Extract</text>
    <text x="12" y="92" fill="#cbd5e1" font-family="monospace" font-size="9">Chunk Slicing</text>
    <text x="12" y="112" fill="#cbd5e1" font-family="monospace" font-size="9">Sample Rate Fix</text>
  </g>

  <path d="M 295 120 L 335 120" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-dp)"/>

  <!-- Stage 3: Audio Processing / Dub Layer -->
  <g transform="translate(340, 55)">
    <rect width="115" height="130" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="10" y="24" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="bold">Processing</text>
    <line x1="10" y1="32" x2="105" y2="32" stroke="#374151" stroke-width="1"/>
    <text x="10" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="9">Transcript Sync</text>
    <text x="10" y="72" fill="#cbd5e1" font-family="sans-serif" font-size="9">Time Alignment</text>
    <text x="10" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="9">Audio Gain Norm</text>
    <text x="10" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="9">Dub Generation</text>
  </g>

  <path d="M 455 120 L 485 120" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-dp)"/>

  <!-- Stage 4: Muxing & Output -->
  <g transform="translate(490, 70)">
    <rect width="85" height="100" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="10" y="24" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">Remuxing</text>
    <line x1="10" y1="32" x2="75" y2="32" stroke="#374151" stroke-width="1"/>
    <text x="10" y="54" fill="#f8fafc" font-family="monospace" font-size="9">Final Sync</text>
    <text x="10" y="74" fill="#f8fafc" font-family="monospace" font-size="9">Rendered</text>
  </g>
</svg>
