<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none" width="100%" height="100%">
  <rect width="600" height="240" rx="8" fill="#0f172a"/>
  
  <defs>
    <pattern id="grid-gst" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="600" height="240" fill="url(#grid-gst)"/>

  <!-- Step 1: Input Ingestion -->
  <g transform="translate(30, 65)">
    <rect width="115" height="110" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="12" y="24" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="bold">Data Ingestion</text>
    <rect x="12" y="38" width="91" height="24" rx="3" fill="#334155"/>
    <text x="18" y="54" fill="#e2e8f0" font-family="monospace" font-size="9">Excel Invoices</text>
    <rect x="12" y="70" width="91" height="24" rx="3" fill="#334155"/>
    <text x="18" y="86" fill="#e2e8f0" font-family="monospace" font-size="9">Ledger Data</text>
  </g>

  <!-- Flow Arrow 1 -->
  <path d="M 145 120 L 175 120" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Pandas Transformation -->
  <g transform="translate(180, 55)">
    <rect width="125" height="130" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="24" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">Pandas Pipeline</text>
    <line x1="12" y1="32" x2="113" y2="32" stroke="#334155" stroke-width="1"/>
    <text x="12" y="52" fill="#cbd5e1" font-family="monospace" font-size="9">✓ Column Clean</text>
    <text x="12" y="72" fill="#cbd5e1" font-family="monospace" font-size="9">✓ GSTIN Regex</text>
    <text x="12" y="92" fill="#cbd5e1" font-family="monospace" font-size="9">✓ Date Parsing</text>
    <text x="12" y="112" fill="#cbd5e1" font-family="monospace" font-size="9">✓ Tax Sum Check</text>
  </g>

  <!-- Flow Arrow 2 -->
  <path d="M 305 120 L 335 120" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Reconciliation Engine -->
  <g transform="translate(340, 55)">
    <rect width="115" height="130" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="10" y="24" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">Reconciliation</text>
    <line x1="10" y1="32" x2="105" y2="32" stroke="#334155" stroke-width="1"/>
    <text x="10" y="54" fill="#94a3b8" font-family="sans-serif" font-size="9">Invoice # Match</text>
    <text x="10" y="74" fill="#94a3b8" font-family="sans-serif" font-size="9">Value Tolerance</text>
    <text x="10" y="94" fill="#94a3b8" font-family="sans-serif" font-size="9">Mismatch Flags</text>
    <text x="10" y="114" fill="#94a3b8" font-family="sans-serif" font-size="9">Audit Summary</text>
  </g>

  <!-- Flow Arrow 3 -->
  <path d="M 455 120 L 480 120" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 4: Streamlit & Export -->
  <g transform="translate(485, 70)">
    <rect width="90" height="100" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="8" y="22" fill="#fb7185" font-family="monospace" font-size="10" font-weight="bold">Streamlit</text>
    <line x1="8" y1="28" x2="82" y2="28" stroke="#334155" stroke-width="1"/>
    <text x="8" y="48" fill="#e2e8f0" font-family="sans-serif" font-size="8">Interactive UI</text>
    <text x="8" y="66" fill="#e2e8f0" font-family="sans-serif" font-size="8">Mismatch Table</text>
    <text x="8" y="84" fill="#38bdf8" font-family="monospace" font-size="8">.xlsx Export</text>
  </g>
</svg>
